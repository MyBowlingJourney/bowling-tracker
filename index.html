<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser chrome (address bar on mobile, task switcher
         preview) should match whichever theme is actually active, but
         that is only known once React has mounted and read the stored
         preference. This is the best static default: the background of
         Chalk, the light palette the redesign opens on. main.jsx still
         updates it at runtime via
         document.querySelector('meta[name="theme-color"]') once
         applyTheme runs, so this is only what shows before that.

         It must stay in step with the manifest's background_color, or
         the splash screen flashes one colour and the app paints
         another. -->
    <meta name="theme-color" content="#F7F8FA" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>My Bowling Journey</title>
  </head>
  <body>
    <div id="root">Opening My Bowling Journey…</div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
