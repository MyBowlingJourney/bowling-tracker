# Regenerates schema-snapshot.csv from the live database.
#
# The snapshot was being produced by hand: run a query in the Supabase
# editor, download the CSV, rename it, commit it. It went stale silently
# twice in one day, and a stale snapshot is worse than none -- two reviews
# read one as current and reported security holes that had already been
# fixed.
#
# Runs weekly and on demand. It does NOT run on every push: a deploy
# should not depend on the database being reachable.
name: Schema snapshot

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday morning
  workflow_dispatch:       # and whenever you want it

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # psql comes from a PINNED CONTAINER, not from the runner image.
    #
    # Every psql call here used to be whatever postgresql-client the
    # Ubuntu image happened to preinstall. Nothing installed it and
    # nothing checked for it, so the version was inherited silently and
    # could change without this repo touching anything.
    #
    # ubuntu-latest moves to Ubuntu 26.04 between 19 Oct and 19 Nov 2026,
    # and the migration notes do not say whether postgresql-client stays
    # preinstalled or at which version. That is the whole problem: an
    # unstated dependency cannot be reasoned about, only discovered when
    # it breaks.
    #
    # Pinning the runner to ubuntu-24.04 would postpone that to the next
    # image migration. Taking psql from a pinned image instead means the
    # runner's OS stops mattering -- this job needs bash, git and docker
    # from it, all of which are stable across the migration.
    #
    # Bump PG_IMAGE deliberately, as a commit somebody reviews.
    env:
      PG_IMAGE: postgres:17-alpine
    steps:
      - uses: actions/checkout@v5

      - name: Pull the pinned psql image
        run: |
          docker pull "$PG_IMAGE"
          # Fail here, loudly, rather than three steps later inside a
          # redirect where a missing psql looks like an empty dump.
          docker run --rm --entrypoint psql "$PG_IMAGE" --version

      - name: Dump the live schema
        env:
          # Supabase → Project Settings → Database → Connection string
          # (URI). Use the SESSION pooler, not the transaction pooler:
          # this is a plain read, and the session pooler keeps COPY simple.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DB_URL is not set — add it in Settings → Secrets."
            exit 1
          fi

          # A DIRECT connection cannot work from here, and the failure it
          # produces does not say so.
          #
          # db.<ref>.supabase.co resolves to IPv6 only. GitHub-hosted
          # runners are IPv4 only. psql reports that as "Network
          # unreachable" against a raw IPv6 address, which reads like the
          # database is down -- so the obvious next move is to check
          # Supabase's status page, and the obvious next move is wrong.
          #
          # The host is the whole diagnosis, so check it up front and say
          # what to do. Printing the host is safe: it is the one part of
          # the URI that is not a credential.
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's|.*@([^:/?]+).*|\1|')
          case "$host" in
            *pooler.supabase.com) : ;;
            db.*.supabase.co)
              echo "SUPABASE_DB_URL points at the DIRECT connection ($host)."
              echo
              echo "That host is IPv6-only and GitHub Actions runners are IPv4-only,"
              echo "so this can never connect. Use the SESSION POOLER instead:"
              echo
              echo "  Supabase → Project Settings → Database → Connection string"
              echo "  → Session pooler (NOT Direct connection, NOT Transaction pooler)"
              echo
              echo "It looks like:"
              echo "  postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres"
              echo
              echo "Note the username is postgres.<ref>, not postgres."
              echo "Then update the secret SUPABASE_DB_URL (that exact name)."
              exit 1
              ;;
            *)
              # Not a shape we recognise. Not fatal -- a self-hosted or
              # proxied database is legitimate -- but worth naming, so an
              # unexpected host is visible in the log rather than only in
              # whatever error it causes three lines later.
              echo "Note: connecting to $host (not a Supabase pooler host)."
              ;;
          esac
          docker run --rm -i -e DATABASE_URL -v "$PWD":/repo -w /repo \
            --entrypoint psql "$PG_IMAGE" "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/audit_schema.sql > schema-snapshot.new.csv
          # A truncated dump would look like a pile of deletions and get
          # committed as if the schema had shrunk.
          lines=$(wc -l < schema-snapshot.new.csv)
          if [ "$lines" -lt 100 ]; then
            echo "Only $lines rows — the dump looks truncated. Not replacing the snapshot."
            exit 1
          fi
          mv schema-snapshot.new.csv schema-snapshot.csv

      - name: Generate the rebuild script
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Runnable DDL, from the same connection in the same job. The
          # previous reconstruction was hand-maintained and drifted 21
          # columns; this one cannot drift by more than a week, and it
          # arrives as a diff somebody looks at.
          # -tA: tuples only, unaligned. The generator used to be wrapped
          # in COPY (...) TO STDOUT, which escaped every newline in the
          # output as a literal \n -- so schema.sql was not runnable SQL
          # at all. A plain SELECT read with -tA emits the statements as
          # written. -X ignores any ~/.psqlrc that might set a pager or
          # a border style and corrupt the output.
          docker run --rm -i -e DATABASE_URL -v "$PWD":/repo -w /repo \
            --entrypoint psql "$PG_IMAGE" "$DATABASE_URL" -X -tA -v ON_ERROR_STOP=1 \
            -f scripts/generate_schema_sql.sql > schema.new.sql
          if ! grep -q "CREATE TABLE IF NOT EXISTS public.shots" schema.new.sql; then
            echo "No shots table in the output — the dump looks wrong. Not replacing schema.sql."
            exit 1
          fi
          # The escaping bug, caught rather than trusted: a literal \n
          # inside a CREATE TABLE is the signature of COPY-style output,
          # and it makes the file unrunnable. Fail loudly if it returns.
          if grep -q 'CREATE TABLE.*\\n' schema.new.sql; then
            echo "schema.sql contains literal \\n — output is escaped and not runnable."
            exit 1
          fi
          mv schema.new.sql schema.sql

      - name: Dump the function bodies
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Thirteen of these are SECURITY DEFINER and are what the RLS
          # policies call. Without them a rebuilt database has policies
          # that reference functions that do not exist.
          docker run --rm -i -e DATABASE_URL -v "$PWD":/repo -w /repo \
            --entrypoint psql "$PG_IMAGE" "$DATABASE_URL" -X -tA -v ON_ERROR_STOP=1 \
            -f scripts/dump_functions.sql > functions.new.sql
          for fn in is_team_member is_league_member record_tombstone set_updated_at; do
            if ! grep -q "FUNCTION public.$fn" functions.new.sql; then
              echo "$fn missing from the dump — not replacing the functions file."
              exit 1
            fi
          done
          mkdir -p supabase/migrations
          mv functions.new.sql supabase/functions.sql

      - name: Assemble the baseline migration
        run: |
          # ONE FILE THAT REBUILDS AN EMPTY DATABASE, in dependency order:
          # functions first, because the triggers and policies in
          # schema.sql call them.
          #
          # This is a BOOTSTRAP, not the ongoing workflow. It exists
          # because 33 tables built by hand in the dashboard cannot be
          # retroactively hand-written into migrations. From here on, a
          # schema change is a NEW hand-written migration file beside
          # this one -- and because the audit compares live tables
          # against what the migrations declare, anything created in the
          # dashboard instead now shows up as drift.
          mkdir -p supabase/migrations
          OUT=supabase/migrations/00000000000000_baseline.sql
          {
            echo "-- BASELINE. Generated once from the live database; not edited by hand."
            echo "-- Later changes go in new migration files beside this one."
            echo
            cat supabase/functions.sql
            echo
            cat schema.sql
          } > "$OUT"
          rm -f supabase/functions.sql
          echo "baseline: $(wc -l < "$OUT") lines"

      - name: Open a pull request if anything changed
        # A PR rather than a direct commit, so a schema change arrives as
        # something to LOOK at. Silently committing drift would make the
        # snapshot accurate and still leave nobody aware the database moved.
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Schema snapshot: refresh from live database"
          branch: schema-snapshot-refresh
          delete-branch: true
          title: "Schema drift: the live database has changed"
          body: |
            The live schema no longer matches `schema-snapshot.csv`.

            Each line here is a real change to the database. If you made it
            deliberately, merge this. If you did not, that is worth finding
            out about before merging.

            `schema-snapshot.csv` is the inventory the audits read.
            `schema.sql` is runnable DDL that rebuilds an EMPTY database --
            no data, and no function bodies for the triggers.

            Generated by `scripts/audit_schema.sql` and
            `scripts/generate_schema_sql.sql`. Neither output is edited by
            hand: if one is wrong, the database is, or the query is.
