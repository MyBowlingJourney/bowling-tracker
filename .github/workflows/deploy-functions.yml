name: Deploy Supabase Functions

# Deploys EVERY function under supabase/functions/, rather than naming them
# one at a time. Naming them individually meant each new function silently
# didn't deploy until someone remembered to edit this file -- which is what
# happened with find-centers.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Both actions pinned to versions that run natively on Node 24.
      #
      # GitHub removes Node 20 from the runners on 16 September 2026. Since
      # June they've been force-running Node 20 actions on Node 24, which
      # is why the deploy still succeeded and only warned -- but the
      # warning is the last notice before removal.
      # Enough history to diff this push against the one before it, so
      # only the functions that changed get deployed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # v2 is the Node 24 native release. If this ever fails to install
      # the CLI, dropping back to @v1 is safe -- v1 still works today,
      # it just warns.
      - uses: supabase/setup-cli@v2
        with:
          # PINNED, not "latest".
          #
          # "latest" makes the action ask GitHub's releases API which
          # version that is, unauthenticated, on every run -- and shared
          # runner IPs hit the 60-requests-an-hour limit for anonymous
          # callers. The deploy then fails with "rate limit exceeded"
          # while nothing is wrong with the deploy itself.
          #
          # Pinning also avoids a second, sharper failure: supabase/cli
          # publishes BETA releases continuously, and "latest" has 404'd
          # when the newest release had no matching artifact. A stable
          # version cannot do that.
          #
          # 2.117.0 is the current stable (the higher tags on GitHub are
          # betas). Bump it deliberately.
          version: 2.117.0
        env:
          # Raises the anonymous limit to 1,000/hour for this repo, so a
          # version bump or a re-run does not fail for the same reason.
          # Automatically provided by Actions; no secret to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploys only what changed, several at once, without Docker.
      #
      # This used to deploy all eleven functions, one after another, on
      # every push that touched any of them -- and without --use-api the
      # CLI bundles each one inside Docker, which means pulling the edge
      # runtime image and starting a container eleven times. A one-line
      # change to nightcap cost the time of redeploying everything.
      #
      # Now:
      #   - only functions whose folder changed in this push are deployed;
      #   - a change under _shared/ deploys everything, since every
      #     function imports from it;
      #   - a manual run (Actions tab) deploys everything, as before;
      #   - --use-api bundles on Supabase's side, no Docker;
      #   - up to four deploy at the same time.
      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The project ref isn't a secret -- it appears in every API URL for
          # this project. Hardcoded so the workflow has no setup step beyond
          # the access token.
          PROJECT_REF: fqjeaxmrzlhczstcdiqs
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          all=$(for d in supabase/functions/*/; do n=$(basename "$d"); case "$n" in _*) ;; *) echo "$n";; esac; done)

          if [ "$EVENT" != "push" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Deploying everything (manual run or no previous commit to compare with)."
            targets="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions)
            if echo "$changed" | grep -q '^supabase/functions/_shared/'; then
              echo "_shared changed: deploying everything."
              targets="$all"
            else
              targets=$(echo "$changed" | awk -F/ 'NF>=4{print $3}' | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi

          if [ -z "$targets" ]; then echo "No function changed."; exit 0; fi
          echo "Deploying:"; echo "$targets"
          echo "$targets" | xargs -P 4 -I{} sh -c \
            'supabase functions deploy "{}" --project-ref "$PROJECT_REF" --use-api && echo "✓ {}" || { echo "✗ {} failed"; exit 1; }'
